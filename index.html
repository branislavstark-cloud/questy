<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Questy">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Domáce Questy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#0e1226; --surface:#181d36; --surface2:#222849; --surface3:#2b3260;
  --text:#eef0ff; --muted:#9aa0c3; --line:#2c3359;
  --star:#ffc233; --star-ink:#3a2a00;
  --primary:#6c8cff; --primary-ink:#0a0f2a;
  --good:#34d399; --bad:#ff6b7a; --warn:#fbbf24;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --r:20px; --r-s:12px;
  --font-display:"Fredoka","Nunito","Segoe UI",system-ui,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f1f2fb; --surface:#ffffff; --surface2:#eaecf8; --surface3:#dfe2f5;
    --text:#171a33; --muted:#5c6285; --line:#d9dcee;
    --primary:#4f6fe6; --primary-ink:#ffffff; --star-ink:#3a2a00;
    --shadow:0 10px 30px rgba(40,50,120,.12);
  }
}
:root[data-theme="light"]{
  --bg:#f1f2fb; --surface:#ffffff; --surface2:#eaecf8; --surface3:#dfe2f5;
  --text:#171a33; --muted:#5c6285; --line:#d9dcee;
  --primary:#4f6fe6; --primary-ink:#ffffff; --star-ink:#3a2a00;
  --shadow:0 10px 30px rgba(40,50,120,.12);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

/* shell */
.shell{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:20px;font-weight:700}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--star),#ff8a3d);display:grid;place-items:center;font-size:18px;box-shadow:0 4px 12px rgba(255,194,51,.35)}
.spacer{flex:1}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 25%,transparent)}
.dot.err{background:var(--bad)}
.dot.sync{background:var(--warn)}
main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:18px 16px 96px}
@media(min-width:900px){ main{padding-bottom:40px} }

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:14px;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.nav button .ic{font-size:22px;line-height:1;transition:transform .2s}
.nav button.active{color:var(--text);background:var(--surface2)}
.nav button.active .ic{transform:translateY(-2px) scale(1.08)}
.nav button .badge{position:absolute}
@media(min-width:900px){
  .nav{position:static;border:0;background:none;padding:0;backdrop-filter:none}
  .nav .in{display:flex;gap:6px;justify-content:flex-end}
  .nav button{flex-direction:row;gap:8px;padding:8px 14px;font-size:14px}
  .nav button .ic{font-size:18px}
  .topbar .in{gap:20px}
  .topbar .nav{flex:1}
}
.rel{position:relative}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.hot{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)}
.pill.good{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.pill.star{background:color-mix(in srgb,var(--star) 22%,transparent);color:var(--star)}
.count{position:absolute;top:2px;right:calc(50% - 26px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
@media(min-width:900px){ .count{position:static;margin-left:4px} }

/* generic */
.section{margin-bottom:26px}
.section-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.section-h h2{font-size:22px}
.section-h .sub{color:var(--muted);font-size:13px;font-weight:700}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:800;font-size:15px;background:var(--surface2);color:var(--text);transition:transform .12s,filter .12s;min-height:44px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.star{background:var(--star);color:var(--star-ink)}
.btn.good{background:var(--good);color:#04241a}
.btn.bad{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.sm{padding:8px 12px;font-size:13px;min-height:36px;border-radius:11px}
.btn.icon{width:40px;height:40px;padding:0;border-radius:12px;font-size:18px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:var(--r)}
.empty .big{font-size:40px;margin-bottom:6px}

/* kid cards on home */
.kidcard{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;text-align:left;border-radius:var(--r);padding:18px;background:var(--surface);box-shadow:var(--shadow);width:100%;transition:transform .15s}
.kidcard:hover{transform:translateY(-2px)}
.kidcard::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0%,color-mix(in srgb,var(--kc) 32%,transparent),transparent 55%);pointer-events:none}
.kidcard .top{display:flex;align-items:center;gap:14px}
.avatar{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:32px;background:color-mix(in srgb,var(--kc) 22%,var(--surface2));border:2px solid color-mix(in srgb,var(--kc) 60%,transparent);flex:none}
.avatar.lg{width:84px;height:84px;font-size:46px;border-radius:26px}
.kidcard .name{font-family:var(--font-display);font-size:22px;font-weight:600}
.kidcard .lvl{color:var(--muted);font-size:13px;font-weight:700}
.points{font-family:var(--font-display);font-size:34px;font-weight:700;color:var(--star);display:flex;align-items:center;gap:6px;line-height:1}
.points small{font-size:14px;color:var(--muted);font-family:var(--font-body);font-weight:800}
.bar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--kc),var(--star));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.kidcard .meta{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted)}

/* kid detail */
.hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.hero h1{font-size:30px}
.hero .stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.hero .pts{margin-left:auto;text-align:right}
.hero .pts .points{font-size:44px;justify-content:flex-end}
.tasks{display:grid;gap:10px}
.task{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);text-align:left;width:100%;transition:transform .12s,opacity .2s}
.task .em{width:48px;height:48px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;font-size:26px;flex:none}
.task .t{flex:1;min-width:0}
.task .t b{display:block;font-size:16px;font-weight:800}
.task .t span{font-size:12px;color:var(--muted);font-weight:700}
.task .p{font-family:var(--font-display);font-weight:700;color:var(--star);font-size:18px;white-space:nowrap}
.task .chk{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-size:20px;flex:none;transition:all .2s}
.task.avail:active{transform:scale(.98)}
.task.avail:hover .chk{border-color:var(--primary)}
.task.pending{opacity:.85}
.task.pending .chk{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 20%,transparent)}
.task.done{opacity:.6}
.task.done .chk{border-color:var(--good);background:var(--good);color:#04241a}
.task.done .t b{text-decoration:line-through}

/* shop */
.shop{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.reward{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);text-align:left}
.reward .em{font-size:40px;line-height:1}
.reward b{font-size:15px;font-weight:800;line-height:1.25}
.reward .cost{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:6px}
.reward .cost .p{font-family:var(--font-display);font-weight:700;color:var(--star);font-size:18px}
.reward.locked{opacity:.55}
.reward .kind{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kidpick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.kidpick button{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;background:var(--surface);font-weight:800;border:2px solid transparent}
.kidpick button.active{border-color:var(--kc);background:color-mix(in srgb,var(--kc) 16%,var(--surface))}
.kidpick .mini{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--kc) 25%,var(--surface2))}

/* parent */
.ptabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{padding:8px 14px;border-radius:999px;font-weight:800;font-size:14px;color:var(--muted);background:var(--surface);white-space:nowrap;flex:none}
.ptabs button.active{background:var(--primary);color:var(--primary-ink)}
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.item .em{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:24px;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:800}
.item .t span{font-size:12px;color:var(--muted);font-weight:700;display:block}
.item .acts{display:flex;gap:6px;flex:none}
.item.off{opacity:.5}
.log{display:grid;gap:6px}
.logrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface);font-size:14px}
.logrow .d{color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap}
.logrow .p{font-weight:800;color:var(--star);white-space:nowrap}
.logrow .p.neg{color:var(--bad)}
.logrow .p.zero{color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-weight:800}
.kv span{display:block;font-size:12px;color:var(--muted);font-weight:700}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--surface2);padding:8px 10px;border-radius:10px;word-break:break-all;user-select:all}
.qr{display:grid;place-items:center;background:#fff;padding:12px;border-radius:14px;width:max-content;max-width:100%;margin:10px auto}
.qr img,.qr canvas{max-width:100%}

/* forms */
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);min-height:46px}
.field input:focus,.field select:focus{border-color:var(--primary);outline:0}
.field .hint{font-size:12px;color:var(--muted)}
.emojis{display:flex;gap:6px;flex-wrap:wrap}
.emojis button{width:40px;height:40px;border-radius:10px;background:var(--surface2);font-size:22px;border:2px solid transparent}
.emojis button.active{border-color:var(--primary)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{min-width:40px;height:36px;padding:0 10px;border-radius:10px;background:var(--surface2);font-weight:800;font-size:13px;border:2px solid transparent;color:var(--muted)}
.days button.active{border-color:var(--primary);color:var(--text)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.swatches button.active{border-color:var(--text)}
.check{display:flex;align-items:center;gap:10px;font-weight:700}
.check input{width:22px;height:22px;accent-color:var(--primary)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(6,8,20,.6);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){ .modal-bg{align-items:center;padding:20px} }
.modal{background:var(--surface);width:100%;max-width:520px;max-height:min(92vh,900px);overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:up .25s cubic-bezier(.2,.8,.2,1)}
@media(min-width:640px){ .modal{border-radius:24px;padding-bottom:20px} }
.modal h2{font-size:22px;margin-bottom:14px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.pinpad button{height:56px;border-radius:14px;background:var(--surface2);font-family:var(--font-display);font-size:22px;font-weight:600}
.pindots{display:flex;justify-content:center;gap:12px;margin:10px 0}
.pindots i{width:16px;height:16px;border-radius:50%;background:var(--surface3);border:2px solid var(--line)}
.pindots i.on{background:var(--primary);border-color:var(--primary)}
.pinerr{color:var(--bad);text-align:center;font-weight:800;min-height:20px;font-size:14px}

/* toast + fx */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface3);color:var(--text);padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;z-index:60;box-shadow:var(--shadow);animation:up .25s;max-width:calc(100vw - 32px);text-align:center}
@media(min-width:900px){ .toast{bottom:28px} }
.float{position:fixed;z-index:70;pointer-events:none;font-family:var(--font-display);font-weight:700;font-size:26px;color:var(--star);text-shadow:0 2px 10px rgba(0,0,0,.4);animation:fly 1.1s ease-out forwards}
@keyframes fly{0%{transform:translate(-50%,0) scale(.7);opacity:0}15%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:65}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>


<div class="shell" id="shell">
  <header class="topbar"><div class="in">
    <div class="brand"><div class="logo">⭐</div><span>Domáce Questy</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="spacer"></div>
    <div class="sync" id="syncbadge"><i class="dot"></i><span>lokálne</span></div>
  </div></header>
  <main id="app"></main>
</div>
<canvas id="confetti"></canvas>
<div id="modals"></div>
<div id="toasts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script>
/* ========= helpers ========= */
const $ = (s, r=document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dayKey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function weekKey(d=new Date()){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y=t.getUTCFullYear(); const w=Math.ceil((((t-Date.UTC(y,0,1))/864e5)+1)/7); return `${y}-W${pad(w)}`; }
const fmtDate = ts => { const d=new Date(ts); const today=dayKey(), k=dayKey(d); const y=new Date(); y.setDate(y.getDate()-1); const t=`${pad(d.getHours())}:${pad(d.getMinutes())}`; if(k===today) return `dnes ${t}`; if(k===dayKey(y)) return `včera ${t}`; return `${d.getDate()}.${d.getMonth()+1}. ${t}`; };
const plural = (n, one, few, many) => n===1?one:(n>=2&&n<=4?few:many);
const pts = n => `${n} ${plural(Math.abs(n),'bod','body','bodov')}`;
async function sha(s){ try{ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('dq:'+s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }catch(e){ return 'plain:'+s; } }
const ls = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };

const KID_COLORS = ['#ff7a59','#4cc9f0','#c084fc','#a3e635','#f472b6','#fb923c','#2dd4bf','#facc15'];
const KID_EMOJI = ['🦊','🐯','🐼','🦄','🐸','🐙','🦖','🐨','🐧','🦋','🐬','🦁','🐺','🐰','🐻','🦉'];
const TASK_EMOJI = ['🛏️','🗑️','🍽️','🧹','📚','✏️','🍳','🧺','🐶','🐱','🌱','🧽','🧦','🚿','🦷','🎒','🧸','🛒','🍎','🧴'];
const REWARD_EMOJI = ['💶','🎮','📱','🎬','🍦','🌙','🎢','🍕','🍬','🎁','🏊','🎨','🎳','📺','🧁','⚽'];
const LEVEL_NAMES = ['Nováčik','Pomocník','Šikovník','Majster','Šampión','Hrdina','Legenda'];
const DAYS = ['Po','Ut','St','Št','Pi','So','Ne'];

function levelInfo(total){
  let lvl=1, need=50, base=0;
  while(total>=base+need){ base+=need; lvl++; need=50+20*(lvl-1); }
  const name = LEVEL_NAMES[Math.min(lvl-1, LEVEL_NAMES.length-1)] + (lvl>LEVEL_NAMES.length? ' '+'I'.repeat(Math.min(lvl-LEVEL_NAMES.length+1,3)) : '');
  return { lvl, name, into: total-base, need, pct: Math.round(100*(total-base)/need) };
}

function normalize(s){
  if(!s || typeof s!=='object') s = seedState();
  s.v = 1; s.meta = s.meta || {};
  for(const k of ['kids','tasks','rewards','pending','log']){ const v=s[k]; s[k] = Array.isArray(v) ? v.filter(Boolean) : (v && typeof v==='object' ? Object.values(v).filter(Boolean) : []); }
  s.tasks.forEach(t=>{ t.days = Array.isArray(t.days)?t.days:(t.days&&typeof t.days==='object'?Object.values(t.days):[]); if(t.kids!=='all' && !Array.isArray(t.kids)) t.kids = t.kids&&typeof t.kids==='object'?Object.values(t.kids):'all'; });
  return s;
}

/* ========= sync (Firebase Realtime Database via REST + SSE, no SDK) ========= */
const sync = {
  cfg: ls.get('dq_sync', null),
  status: 'local', es:null, dirty:new Set(), timer:null, retry:null,
  url(p=''){ return `${this.cfg.db.replace(/\/+$/,'')}/families/${this.cfg.key}${p}.json`; },
  set(cfg){ this.cfg = cfg; ls.set('dq_sync', cfg); },
  disconnect(){ if(this.es){ this.es.close(); this.es=null; } this.cfg=null; ls.del('dq_sync'); this.status='local'; renderSync(); },
  async connect(){
    if(!this.cfg) return;
    this.status='sync'; renderSync();
    try{
      const r = await fetch(this.url(), {cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const remote = await r.json();
      if(remote && remote.kids){ state = normalize(remote); ls.set('dq_state', state); render(); }
      else { await this.put(); }
      this.listen();
      this.status='on'; renderSync();
    }catch(e){ console.warn('sync connect failed', e); this.status='err'; renderSync(); if(!this.retry) this.retry=setTimeout(()=>{this.retry=null;this.connect();}, 15000); }
  },
  async put(){ const r = await fetch(this.url(), {method:'PUT', body:JSON.stringify(state)}); if(!r.ok) throw new Error('PUT '+r.status); },
  listen(){
    if(this.es) this.es.close();
    const es = new EventSource(this.url());
    this.es = es;
    es.addEventListener('put', ev => this.apply(JSON.parse(ev.data), true));
    es.addEventListener('patch', ev => this.apply(JSON.parse(ev.data), false));
    es.onerror = () => { this.status='err'; renderSync(); };
    es.onopen = () => { this.status='on'; renderSync(); };
  },
  apply({path, data}, replace){
    if(this.dirty.size) return; // our own write is in flight; it will echo back later
    if(path==='/'){ if(replace){ if(data) state = normalize(data); } else { Object.assign(state, data||{}); state=normalize(state); } }
    else{
      const parts = path.split('/').filter(Boolean);
      if(parts.length===1){ state[parts[0]] = data; state = normalize(state); }
      else { // nested change: refetch whole doc for simplicity
        fetch(this.url(),{cache:'no-store'}).then(r=>r.json()).then(d=>{ if(d){ state=normalize(d); ls.set('dq_state',state); render(); } }).catch(()=>{});
        return;
      }
    }
    ls.set('dq_state', state); render();
  },
  push(keys){
    if(!this.cfg) return;
    keys.forEach(k=>this.dirty.add(k));
    clearTimeout(this.timer);
    this.timer = setTimeout(()=>this.flush(), 250);
  },
  async flush(){
    if(!this.cfg || !this.dirty.size) return;
    const keys=[...this.dirty]; const body={}; keys.forEach(k=>body[k]=state[k]);
    this.status='sync'; renderSync();
    try{
      const r = await fetch(this.url(), {method:'PATCH', body:JSON.stringify(body)});
      if(!r.ok) throw new Error('PATCH '+r.status);
      keys.forEach(k=>this.dirty.delete(k));
      this.status='on';
    }catch(e){ console.warn('sync push failed', e); this.status='err'; setTimeout(()=>this.flush(), 10000); }
    renderSync();
  }
};
window.addEventListener('online', ()=>{ if(sync.cfg){ sync.connect(); sync.flush(); } });
function renderSync(){
  const el=$('#syncbadge'); if(!el) return;
  const map={local:['','lokálne'], on:['on','synchronizované'], sync:['sync','ukladám…'], err:['err','offline']};
  const [c,t]=map[sync.status]||map.local;
  el.innerHTML=`<i class="dot ${c}"></i><span>${t}</span>`;
}

/* ========= domain ========= */
const kidById = id => state.kids.find(k=>k.id===id);
const taskById = id => state.tasks.find(t=>t.id===id);
const rewardById = id => state.rewards.find(r=>r.id===id);
function periodKey(task, d=new Date()){ return task.repeat==='daily'?dayKey(d):task.repeat==='weekly'?weekKey(d):'once'; }
function taskAppliesToday(task, kid){
  if(!task.active) return false;
  if(task.kids!=='all' && !(task.kids||[]).includes(kid.id)) return false;
  if(task.repeat==='daily'){ const dow=(new Date().getDay()+6)%7; if(task.days && task.days.length && !task.days.includes(dow)) return false; }
  return true;
}
function taskStatus(task, kid){
  const pk = periodKey(task);
  if(state.pending.some(p=>p.taskId===task.id && p.kidId===kid.id && p.period===pk)) return 'pending';
  if(state.log.some(l=>l.type==='done' && l.taskId===task.id && l.kidId===kid.id && l.period===pk)) return 'done';
  return 'avail';
}
function kidTasksToday(kid){
  return state.tasks.filter(t=>taskAppliesToday(t,kid)).map(t=>({task:t, status:taskStatus(t,kid)})).filter(x=>!(x.task.repeat==='once' && x.status==='done'));
}
function streak(kid){
  const days = new Set(state.log.filter(l=>l.type==='done'&&l.kidId===kid.id).map(l=>dayKey(new Date(l.at))));
  let n=0; const d=new Date(); if(!days.has(dayKey(d))) d.setDate(d.getDate()-1);
  while(days.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function doneToday(kid){ const t=dayKey(); return state.log.filter(l=>l.type==='done'&&l.kidId===kid.id&&dayKey(new Date(l.at))===t).length; }
function addLog(entry){ state.log.unshift({id:uid(), at:Date.now(), ...entry}); if(state.log.length>600) state.log.length=600; }

function markDone(taskId, kidId){
  const task=taskById(taskId), kid=kidById(kidId); if(!task||!kid) return;
  if(taskStatus(task,kid)!=='avail') return;
  state.pending.unshift({id:uid(), taskId, kidId, period:periodKey(task), at:Date.now()});
  save(['pending']); toast(`${task.emoji} Poslané rodičovi na schválenie`); render();
}
function undoDone(taskId, kidId){
  const i=state.pending.findIndex(p=>p.taskId===taskId&&p.kidId===kidId); if(i<0) return;
  state.pending.splice(i,1); save(['pending']); render();
}
function approve(pid, ok){
  const i=state.pending.findIndex(p=>p.id===pid); if(i<0) return;
  const p=state.pending[i]; const task=taskById(p.taskId), kid=kidById(p.kidId);
  state.pending.splice(i,1);
  if(ok && task && kid){
    kid.points=(kid.points||0)+task.points; kid.total=(kid.total||0)+task.points;
    addLog({type:'done', kidId:kid.id, taskId:task.id, title:task.title, emoji:task.emoji, points:task.points, period:p.period});
    toast(`✅ ${kid.name}: +${pts(task.points)}`);
  } else if(task && kid){
    addLog({type:'rejected', kidId:kid.id, taskId:task.id, title:task.title, emoji:task.emoji, points:0, period:p.period});
  }
  save(['pending','kids','log']); render();
}
function buy(rewardId, kidId, ev){
  const r=rewardById(rewardId), kid=kidById(kidId); if(!r||!kid) return;
  if((kid.points||0)<r.cost){ toast(`Ešte ti chýba ${pts(r.cost-(kid.points||0))}`); return; }
  confirmModal({title:`Kúpiť ${r.emoji} ${r.title}?`, text:`Za ${pts(r.cost)}. Ostane ti ${pts(kid.points-r.cost)}.`, ok:'Kúpiť', cls:'star'}, ()=>{
    kid.points-=r.cost;
    addLog({type:'reward', kidId:kid.id, rewardId:r.id, title:r.title, emoji:r.emoji, points:-r.cost, delivered:false});
    save(['kids','log']); floatText(`-${r.cost} ⭐`, ev); toast(`${r.emoji} Kúpené! Rodič ti to vydá.`); render();
  });
}
function adjust(kidId, delta, note){
  const kid=kidById(kidId); if(!kid||!delta) return;
  kid.points=(kid.points||0)+delta; if(delta>0) kid.total=(kid.total||0)+delta;
  addLog({type:'adjust', kidId:kid.id, title:note||(delta>0?'Bonus':'Pokuta'), emoji:delta>0?'🎁':'⚠️', points:delta});
  save(['kids','log']); render();
}

function openModal(html, onMount){
  const bg=document.createElement('div'); bg.className='modal-bg'; bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener('click', e=>{ if(e.target===bg) closeModal(); });
  $('#modals').appendChild(bg); const first=bg.querySelector('input:not([type=hidden]),button.pinpad'); if(first&&window.innerWidth>640) first.focus();
  if(onMount) onMount(bg); return bg;
}
function closeModal(){ const m=$('#modals'); if(m.lastElementChild) m.lastElementChild.remove(); }
function confirmModal({title,text,ok,cls}, cb){
  openModal(`<h2>${title}</h2><p class="muted">${text||''}</p><div class="foot"><button class="btn" data-act="close">Zrušiť</button><button class="btn ${cls||'primary'}" id="m-ok">${ok||'OK'}</button></div>`, bg=>{ bg.querySelector('#m-ok').onclick=()=>{ closeModal(); cb(); }; });
}
function pinModal(mode, cb){
  let entered='';
  const title = mode==='set'?'Nový PIN (4 číslice)':'Rodičovský PIN';
  const bg=openModal(`<h2 style="text-align:center">${title}</h2><div class="pindots" id="pd"><i></i><i></i><i></i><i></i></div><div class="pinerr" id="pe"></div><div class="pinpad">${[1,2,3,4,5,6,7,8,9,'','0','⌫'].map(k=>`<button data-k="${k}" ${k===''?'disabled style="visibility:hidden"':''}>${k}</button>`).join('')}</div><div class="foot"><button class="btn ghost" data-act="close">Zrušiť</button></div>`);
  const draw=()=>{ bg.querySelectorAll('#pd i').forEach((d,i)=>d.classList.toggle('on',i<entered.length)); };
  const key=async k=>{ if(k==='⌫'){ entered=entered.slice(0,-1); draw(); return; } if(entered.length>=4) return; entered+=k; draw(); if(entered.length===4){ const ok=await cb(entered); if(ok===false){ bg.querySelector('#pe').textContent='Nesprávny PIN'; entered=''; setTimeout(draw,150);} else closeModal(); } };
  bg.querySelectorAll('.pinpad button').forEach(b=>b.onclick=()=>key(b.dataset.k));
  const kh=e=>{ if(!document.body.contains(bg)){ document.removeEventListener('keydown',kh); return; } if(/^[0-9]$/.test(e.key)) key(e.key); else if(e.key==='Backspace') key('⌫'); else if(e.key==='Escape') closeModal(); };
  document.addEventListener('keydown',kh);
}
async function checkPin(p){ const h=state.meta.pinHash; if(!h) return p==='1234'; return (await sha(p))===h; }
function unlockParent(){ pinModal('check', async p=>{ if(await checkPin(p)){ parentUntil=Date.now()+15*60000; sessionStorage.setItem('dq_parent',parentUntil); render(); return true; } return false; }); }

/* ========= fx ========= */
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; const box=$('#toasts'); box.innerHTML=''; box.appendChild(t); setTimeout(()=>t.remove(),2600); }
function floatText(text, ev){ const el=document.createElement('div'); el.className='float'; el.textContent=text; const x=ev&&ev.clientX?ev.clientX:window.innerWidth/2, y=ev&&ev.clientY?ev.clientY:window.innerHeight/2; el.style.left=x+'px'; el.style.top=y+'px'; document.body.appendChild(el); setTimeout(()=>el.remove(),1200); }
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=$('#confetti'), ctx=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#ffc233','#ff7a59','#4cc9f0','#c084fc','#a3e635','#f472b6'];
  const ps=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:4+Math.random()*5,a:Math.random()*6,va:(Math.random()-.5)*.3,col:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0; (function frame(){ ctx.clearRect(0,0,c.width,c.height); ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.a+=p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.col; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); ctx.restore(); }); if(++t<150) requestAnimationFrame(frame); else ctx.clearRect(0,0,c.width,c.height); })();
}
function applyTheme(){ const t=ls.get('dq_theme','auto'); const root=document.documentElement; if(t==='auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme',t); }
function drawQR(){ const el=$('#qr'); if(!el||!sync.cfg) return; el.innerHTML=''; const link=`${location.origin}${location.pathname}?db=${encodeURIComponent(sync.cfg.db)}&key=${encodeURIComponent(sync.cfg.key)}`; if(window.QRCode){ try{ new QRCode(el,{text:link,width:180,height:180,correctLevel:QRCode.CorrectLevel.M}); }catch(e){ el.remove(); } } else el.remove(); }

document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, d=el.dataset;
  switch(a){
    case 'nav': go({name:d.v, kidId:d.kid||view.kidId}); break;
    case 'pickKidTasks': go({name:'kid', kidId:d.kid}); break;
    case 'pickKidShop': go({name:'shop', kidId:d.kid}); break;
    case 'done': markDone(d.task, d.kid); floatText('⏳', e); break;
    case 'undo': undoDone(d.task, d.kid); break;
    case 'buy': buy(d.reward, d.kid, e); break;
    case 'pin': unlockParent(); break;
    case 'ptab': ptab=d.t; render(); if(ptab==='settings') drawQR(); break;
    case 'approve': if(d.ok==='1') floatText('+⭐', e); approve(d.id, d.ok==='1'); break;
    case 'deliver': { const l=state.log.find(x=>x.id===d.id); if(l){ l.delivered=true; save(['log']); toast('Odmena vydaná 🎉'); render(); } break; }
    case 'refund': { const l=state.log.find(x=>x.id===d.id); const k=l&&kidById(l.kidId); if(l&&k){ k.points=(k.points||0)-l.points; state.log=state.log.filter(x=>x.id!==l.id); save(['log','kids']); toast(`Body vrátené: ${k.name} ⭐ ${k.points}`); render(); } break; }
    case 'editKid': kidModal(d.kid); break;
    case 'editTask': taskModal(d.id); break;
    case 'editReward': rewardModal(d.id); break;
    case 'adjust': adjustModal(d.kid); break;
    case 'close': closeModal(); break;
    case 'setpin': pinModal('set', async p=>{ state.meta.pinHash=await sha(p); save(['meta']); toast('PIN zmenený'); render(); }); break;
    case 'lock': parentUntil=0; sessionStorage.removeItem('dq_parent'); go({name:'home'}); break;
    case 'genkey': { const i=$('#f-key'); if(i) i.value=[...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(36).padStart(2,'0')).join('').slice(0,20); break; }
    case 'connect': { const db=($('#f-db').value||'').trim(); let key=($('#f-key').value||'').trim(); if(!/^https:\/\/.+firebasedatabase\.app|firebaseio\.com/.test(db)){ toast('Zadaj URL databázy (…firebasedatabase.app)'); return; } if(!key){ key=[...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(36).padStart(2,'0')).join('').slice(0,20); } if(!/^[A-Za-z0-9_-]{8,64}$/.test(key)){ toast('Kľúč: 8–64 znakov, písmená/čísla'); return; } sync.set({db,key}); sync.connect().then(()=>{ render(); drawQR(); }); break; }
    case 'unsync': confirmModal({title:'Odpojiť synchronizáciu?',text:'Dáta v tomto prehliadači ostanú, ostatné zariadenia už neuvidia zmeny odtiaľto.',ok:'Odpojiť',cls:'bad'},()=>{ sync.disconnect(); render(); }); break;
    case 'copy': navigator.clipboard?.writeText(d.text).then(()=>toast('Skopírované')).catch(()=>toast('Skopíruj odkaz ručne')); break;
    case 'export': { const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`domace-questy-${dayKey()}.json`; a.click(); break; }
    case 'reset': confirmModal({title:'Vymazať všetko?',text:'Deti, úlohy, odmeny aj históriu. Ak je zapnutá synchronizácia, vymaže sa to aj ostatným.',ok:'Vymazať',cls:'bad'},()=>{ const s=seedState(); s.kids=[]; s.tasks=[]; s.rewards=[]; s.meta.pinHash=state.meta.pinHash; state=s; save(); render(); }); break;
  }
});
document.addEventListener('change', e=>{
  if(e.target.id==='f-theme'){ ls.set('dq_theme', e.target.value); applyTheme(); }
  if(e.target.id==='f-import'){ const f=e.target.files[0]; if(!f) return; f.text().then(t=>{ const s=normalize(JSON.parse(t)); confirmModal({title:'Nahradiť dáta zálohou?',text:`${s.kids.length} detí, ${s.tasks.length} úloh, ${s.log.length} záznamov.`,ok:'Importovať'},()=>{ state=s; save(); render(); toast('Záloha načítaná'); }); }).catch(()=>toast('Súbor sa nepodarilo prečítať')); }
});

/* ========= boot ========= */
(function boot(){
  applyTheme();
  const q=new URLSearchParams(location.search);
  if(q.get('db') && q.get('key')){ sync.set({db:q.get('db'), key:q.get('key')}); history.replaceState(null,'',location.pathname); toast('Pripájam sa k rodine…'); }
  if(!state.kids.length && !ls.get('dq_state',null)) state=seedState();
  state.kids.forEach(k=>prevLevels[k.id]=levelInfo(k.total||0).lvl);
  render();
  if(sync.cfg) sync.connect();
  if('serviceWorker' in navigator && /github\.io$|localhost/.test(location.hostname)){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
  setInterval(()=>{ if(view.name==='parent' && !isParent()) render(); }, 30000);
})();
</script>
